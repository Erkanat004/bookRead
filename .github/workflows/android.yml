name: Build LUMI Reader APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Verify library logic
        run: npm test
      - name: Build offline web assets
        run: npm run build
      - name: Sync Android project
        run: npx cap sync android
      - name: Prepare Gradle wrapper
        run: chmod +x android/gradlew
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2
      - name: Name APK and compute checksum
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/LUMI-Reader.apk
          cd output
          sha256sum LUMI-Reader.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LUMI-Reader-APK
          path: output/
          if-no-files-found: error
          retention-days: 30
